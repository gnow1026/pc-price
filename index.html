<!doctype html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>내 PC 얼마일까?</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div class="container">
            <h1>내 PC 얼마일까? 🖥️</h1>
            <p class="subtitle">부품을 선택하면 중고 시세를 알려드려요</p>

            <!-- 면책조항 -->
            <div class="notice">
                ⚠️ 본 시세는 컴퓨존 중고 데이터 기반 AI 추정가로, 실제 시세와 차이가 있을 수 있어요. 보유 부품이 목록에
                없다면 <strong>비슷한 스펙</strong>을 선택해주세요.
            </div>

            <!-- CPU -->
            <div class="section">
                <div class="section-title">CPU <span class="required">*</span></div>
                <div class="btn-group" id="cpu-brand">
                    <button class="sel-btn" onclick="selectCpuBrand('인텔')">인텔</button>
                    <button class="sel-btn" onclick="selectCpuBrand('AMD')">AMD</button>
                </div>
                <div class="btn-group hidden" id="cpu-series"></div>
                <div class="btn-group hidden" id="cpu-model"></div>
            </div>

            <!-- RAM -->
            <div class="section">
                <div class="section-title">RAM <span class="required">*</span></div>
                <div class="btn-group" id="ram-type">
                    <button class="sel-btn" onclick="selectRamType('DDR3')">DDR3</button>
                    <button class="sel-btn" onclick="selectRamType('DDR4')">DDR4</button>
                    <button class="sel-btn" onclick="selectRamType('DDR5')">DDR5</button>
                </div>
                <div class="btn-group hidden" id="ram-size">
                    <button class="sel-btn" onclick="selectRamSize('4GB')">4GB</button>
                    <button class="sel-btn" onclick="selectRamSize('8GB')">8GB</button>
                    <button class="sel-btn" onclick="selectRamSize('16GB')">16GB</button>
                    <button class="sel-btn" onclick="selectRamSize('32GB')">32GB</button>
                    <button class="sel-btn" onclick="selectRamSize('64GB')">64GB</button>
                </div>
            </div>

            <!-- GPU -->
            <div class="section">
                <div class="section-title">GPU <span class="optional">(선택)</span></div>
                <div class="btn-group" id="gpu-brand">
                    <button class="sel-btn" onclick="selectGpuBrand('엔비디아')">엔비디아</button>
                    <button class="sel-btn" onclick="selectGpuBrand('AMD')">AMD</button>
                    <button class="sel-btn" onclick="selectGpuBrand('없음')">내장그래픽</button>
                </div>
                <div class="btn-group hidden" id="gpu-series"></div>
                <div class="btn-group hidden" id="gpu-model"></div>
            </div>

            <!-- 저장장치 -->
            <div class="section">
                <div class="section-title">저장장치 <span class="optional">(선택)</span></div>
                <div class="btn-group" id="storage-type">
                    <button class="sel-btn" onclick="selectStorageType('NVMe SSD')">NVMe SSD</button>
                    <button class="sel-btn" onclick="selectStorageType('SATA SSD')">SATA SSD</button>
                    <button class="sel-btn" onclick="selectStorageType('HDD')">HDD</button>
                </div>
                <div class="btn-group hidden" id="storage-size">
                    <button class="sel-btn" onclick="selectStorageSize('256GB')">256GB</button>
                    <button class="sel-btn" onclick="selectStorageSize('512GB')">512GB</button>
                    <button class="sel-btn" onclick="selectStorageSize('1TB')">1TB</button>
                    <button class="sel-btn" onclick="selectStorageSize('2TB')">2TB</button>
                </div>
            </div>

            <!-- 제조연도 -->
            <div class="section">
                <div class="section-title">제조연도 <span class="optional">(선택)</span></div>
                <div class="btn-group" id="year-group">
                    <button class="sel-btn" onclick="selectYear('2024')">2024</button>
                    <button class="sel-btn" onclick="selectYear('2023')">2023</button>
                    <button class="sel-btn" onclick="selectYear('2022')">2022</button>
                    <button class="sel-btn" onclick="selectYear('2021')">2021</button>
                    <button class="sel-btn" onclick="selectYear('2020')">2020</button>
                    <button class="sel-btn" onclick="selectYear('2019 이전')">2019 이전</button>
                </div>
            </div>

            <button id="estimate-btn" class="estimate-btn" onclick="estimate()">가격 알아보기</button>

            <!-- 결과 -->
            <div class="result hidden" id="result">
                <h2>예상 시세</h2>
                <div id="result-text"></div>
                <div class="contact">
                    <p>💬 직접 팔고 싶으신가요?</p>
                    <button class="contact-btn" onclick="showComingSoon()">수거 문의하기</button>
                </div>
            </div>
        </div>

        <!-- 팝업 -->
        <div class="popup-overlay hidden" id="popup-overlay" onclick="hidePopup()">
            <div class="popup" onclick="event.stopPropagation()">
                <div class="popup-icon">🚀</div>
                <h3>준비 중이에요!</h3>
                <p>수거 문의 서비스는 현재 준비 중이에요.<br />조금만 기다려주시면 곧 찾아올게요!</p>
                <button class="popup-btn" onclick="hidePopup()">확인</button>
            </div>
        </div>

        <script src="script.js"></script>
    </body>
</html>
